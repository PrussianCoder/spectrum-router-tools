<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spectrum Router</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,sans-serif;color:#222;background:white}
    *{box-sizing:border-box}body{margin:0}main{height:100dvh;display:grid;grid-template-columns:clamp(240px,23vw,320px) minmax(0,1fr);gap:16px;padding:12px;overflow:hidden}
    .sidebar{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow:auto;padding-right:12px;border-right:1px solid #ddd}
    h1{font-size:19px;font-weight:600;margin:0}.score{font-size:15px;white-space:nowrap;margin-top:6px}.score strong{font-size:26px;font-variant-numeric:tabular-nums}.inv{font-size:13px;color:#475569;font-variant-numeric:tabular-nums}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row+.row{margin-top:8px}
    input,button,textarea{font:inherit}label,button{font-size:13px}button,input[type=number],input[type=text]{border:1px solid #bbb;border-radius:3px;padding:5px 7px;background:#fff}button{cursor:pointer}button:hover{background:#f3f4f6}button:disabled{opacity:.5;cursor:default}
    #seed{width:100px}#size{width:56px}.settings{flex:none}.io-panel{display:flex;flex-direction:column;gap:6px;flex:1;min-height:135px}
    .io-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.io-header label{font-weight:600}.io-panel input[type=file]{font-size:11px;max-width:100%;width:100%}
    textarea{width:100%;flex:1;min-height:65px;resize:none;border:1px solid #bbb;border-radius:3px;padding:6px;font:12px/1.4 ui-monospace,monospace;white-space:pre}
    #error{color:#b91c1c;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;flex:none}#error:empty{display:none}
    .stage{position:relative;min-width:0;min-height:0;overflow:hidden}#viewport,#board{width:100%;height:100%;overflow:hidden}
    #info{font-size:13px;font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums}#info:empty{display:none}
    #laser{width:72px}.find-result{font-size:12px;color:#475569}#board svg{display:block;width:100%;height:100%}#board.manual rect[data-row]{cursor:crosshair}
    @media(max-width:650px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px;padding:6px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:35dvh;overflow:auto;border-right:0;border-bottom:1px solid #ddd;padding:0 0 6px}.sidebar header,.settings,#error,.actions{grid-column:1/-1}.sidebar header{display:flex;align-items:baseline;justify-content:space-between}.score{margin:0}.score strong{font-size:22px}.io-panel{min-height:125px}.settings .row{display:inline-flex;margin:0 8px 4px 0}h1{font-size:17px}}
  </style>
</head>
<body><main>
  <aside class="sidebar">
    <header><h1>Spectrum Router</h1><div class="score">Score: <strong id="score">—</strong><div class="inv">転倒数: <span id="inversions">—</span> / 最大 <span id="maxPairs">—</span></div></div></header>
    <section class="settings">
      <div class="row">
        <label>Seed <input id="seed" type="text" value="0" inputmode="numeric"></label>
        <label>N <input id="size" type="number" min="1" max="100" value="64"></label>
        <button id="generate" disabled>生成</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="labels" checked> 番号を表示</label>
        <label><input type="checkbox" id="manual"> Manual mode</label>
        <label><input type="checkbox" id="allPaths" checked> 全経路を表示</label>
      </div>
      <div class="row">
        <label>レーザー番号 <input id="laser" type="number" min="1" placeholder="例: 1"></label>
        <button id="clearLaser">解除</button>
      </div>
      <div class="row find-result" id="laserResult">番号を入れると、その光の入口と出口を強調表示します</div>
      <div class="row" id="info"></div>
    </section>
    <section class="io-panel">
      <div class="io-header"><label for="input">Input</label><button id="saveInput">保存</button></div>
      <input id="inputFile" type="file" accept=".txt,.in,text/plain" aria-label="入力ファイル">
      <textarea id="input" spellcheck="false" aria-label="入力データ"></textarea>
    </section>
    <section class="io-panel">
      <div class="io-header"><label for="output">Output</label><button id="saveOutput">保存</button></div>
      <input id="outputFile" type="file" accept=".txt,.out,text/plain" aria-label="出力ファイル">
      <textarea id="output" spellcheck="false" aria-label="出力データ"></textarea>
    </section>
    <div class="row actions"><button id="undo" disabled>元に戻す</button><button id="empty">鏡を消す</button><button id="saveSvg" disabled>SVG 保存</button></div>
    <div id="error" role="alert"></div>
  </aside>
  <section class="stage">
    <div id="viewport"><div id="board"></div></div>
  </section>
</main>

const $ = id => document.getElementById(id);
let state = null, summary = null, history = [], revision = 0;
let hover = {entry:-1,row:-1,col:-1}, hoverKey = '', pending = 0, pinned = -1;
const error = e => { $('error').textContent = String(e instanceof Error ? e.message : e); };
function resetHover(){ hover={entry:-1,row:-1,col:-1}; hoverKey=''; }
function clearState(){ if(state) state.free(); state=null; summary=null; $('board').innerHTML=''; $('score').textContent='—'; $('inversions').textContent='—'; $('maxPairs').textContent='—'; $('saveSvg').disabled=true; $('info').textContent=''; }
// 入力 A を読み取る（A[i] = ポート i から入るレーザー番号）。
function laserIds(){ return $('input').value.trim().split(/\s+/).slice(1).map(Number); }
function laserText(entry){
  if(!summary||entry<0) return '';
  const a=laserIds()[entry];
  return `レーザー ${a}：入口ポート ${entry} → 受信ポート ${summary.destinations[entry]}`;
}
function setPinned(entry){
  pinned=entry;
  if(entry<0){ $('laser').value=''; $('laserResult').textContent='番号を入れると、その光の入口と出口を強調表示します'; }
  else{ $('laser').value=String(laserIds()[entry]); $('laserResult').textContent=laserText(entry); }
  render();
}
function findLaser(){
  if(!summary) return;
  const x=Number($('laser').value), ids=laserIds();
  if(!$('laser').value.trim()){ setPinned(-1); return; }
  const entry=ids.indexOf(x);
  if(entry<0){ pinned=-1; $('laserResult').textContent=`レーザー番号は 1〜${ids.length} で指定してください`; render(); return; }
  setPinned(entry);
}
function update(){
  resetHover();
  try{
    const next = new Visualizer($('input').value,$('output').value);
    if(state) state.free(); state=next; summary=JSON.parse(state.summary());
    $('score').textContent=summary.score.toLocaleString();
    $('inversions').textContent=summary.inversions.toLocaleString();
    $('maxPairs').textContent=(summary.score+summary.inversions).toLocaleString();
    $('error').textContent=''; $('saveSvg').disabled=false;
    $('laser').max=String(4*state.n());
    if(pinned>=4*state.n()) pinned=-1;
    if(pinned>=0) $('laserResult').textContent=laserText(pinned);
    render();
  }catch(e){ clearState(); error(e); }
}
function render(){
  if(!state) return;
  // マスの hover 中は、そのマスを通る光だけを表示する。
  const entry=hover.entry>=0?hover.entry:hover.row>=0?-1:pinned;
  $('board').innerHTML=state.render(-1,-1,$('allPaths').checked,$('labels').checked,entry,hover.row,hover.col);
  if(hover.entry>=0) $('info').textContent=laserText(hover.entry);
  else if(hover.row>=0){ const k=($('board').innerHTML.match(/<polyline/g)||[]).length-($('allPaths').checked?4*state.n():0); $('info').textContent=`マス (${hover.row},${hover.col}) を通る光：${k} 本`; }
  else $('info').textContent=pinned>=0?'固定中：'+laserText(pinned):'';
  $('board').classList.toggle('manual',$('manual').checked);
}
function emptyBoard(){ const n=Number($('input').value.trim().split(/\s+/)[0]); if(!Number.isInteger(n)||n<1||n>100) throw new Error('先に有効な入力を用意してください'); return Array(n).fill('0'.repeat(n)).join('\n')+'\n'; }
function remember(){history.push($('output').value);if(history.length>100)history.shift();$('undo').disabled=false;}
function resetHistory(){ history=[];$('undo').disabled=true; }
function save(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function newInput(){try{ const data=generate($('seed').value,Number($('size').value));$('input').value=data;$('output').value=emptyBoard();resetHistory();update(); }catch(e){error(e);}}
$('generate').onclick=newInput;
for(const id of ['input','output']) $(id).addEventListener('input',()=>{revision++;resetHistory();clearTimeout(pending);pending=setTimeout(update,180);});
for(const [file,text] of [['inputFile','input'],['outputFile','output']]) $(file).onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const ticket=++revision;
  try{const content=await f.text();if(ticket!==revision)return;$(text).value=content;resetHistory();update();}catch(e){error(e);}
};
$('empty').onclick=()=>{try{remember();$('output').value=emptyBoard();update();}catch(e){error(e);}};
$('undo').onclick=()=>{if(history.length){$('output').value=history.pop();$('undo').disabled=!history.length;update();}};
$('saveInput').onclick=()=>save('input.txt',$('input').value);
$('saveOutput').onclick=()=>save('output.txt',$('output').value);
$('saveSvg').onclick=()=>{if(state)save('spectrum-router.svg',$('board').innerHTML,'image/svg+xml');};
$('labels').onchange=render;
$('manual').onchange=render;
$('allPaths').onchange=render;
$('laser').addEventListener('input',findLaser);
$('clearLaser').onclick=()=>setPinned(-1);
$('board').addEventListener('pointermove',e=>{
  if(!state)return;
  const ball=e.target.closest('[data-entry]'),cell=e.target.closest('[data-row]');
  const key=ball?`entry:${ball.dataset.entry}:${ball.dataset.kind}:${ball.dataset.port}`:cell?`cell:${cell.dataset.row}:${cell.dataset.col}`:'';
  if(key===hoverKey)return;hoverKey=key;hover={entry:-1,row:-1,col:-1};
  if(ball){hover.entry=Number(ball.dataset.entry);}
  else if(cell){hover.row=Number(cell.dataset.row);hover.col=Number(cell.dataset.col);}
  render();
});
$('board').addEventListener('pointerleave',()=>{if(!hoverKey)return;resetHover();render();});
$('board').addEventListener('click',e=>{
  if(!state)return;
  const port=e.target.closest('[data-entry]');
  if(port){const entry=Number(port.dataset.entry);setPinned(pinned===entry?-1:entry);return;}
  const cell=e.target.closest('[data-row]');if(!cell||!$('manual').checked)return;
  const r=Number(cell.dataset.row),c=Number(cell.dataset.col),rows=$('output').value.trimEnd().split(/\r?\n/);const chars=[...rows[r]],cycle=['0','1','2'];
  remember();chars[c]=cycle[(cycle.indexOf(chars[c])+1)%3];rows[r]=chars.join('');$('output').value=rows.join('\n')+'\n';update();
});
